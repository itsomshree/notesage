{% extends "base.html" %}

{% block title %}Delete Note — NoteSage{% endblock %}

{% block content %}
<div class="confirm-card">
    <h2>Delete "{{ object.title }}"?</h2>
    <p class="text-muted">This can't be undone.</p>
    <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete note</button>
        <a href="{% url 'note_detail' object.pk %}" class="btn btn-link">Cancel</a>
    </form>
</div>
{% endblock %}
