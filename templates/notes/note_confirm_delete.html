{% extends "base.html" %}

{% block title %}Delete Note — NoteSage{% endblock %}

{% block content %}
<h2>Delete "{{ object.title }}"?</h2>
<p>This can't be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'note_detail' object.pk %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
