{% extends "base.html" %}

{% block title %}{% if object %}Edit Note{% else %}New Note{% endif %} — NoteSage{% endblock %}

{% block content %}
<h2>{% if object %}Edit note{% else %}New note{% endif %}</h2>
<form method="post" class="stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save note</button>
    {% if object %}
    <a href="{% url 'note_detail' object.pk %}" class="btn btn-link">Cancel</a>
    {% else %}
    <a href="{% url 'note_list' %}" class="btn btn-link">Cancel</a>
    {% endif %}
</form>
{% endblock %}
