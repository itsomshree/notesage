{% extends "base.html" %}

{% block title %}Log in — NoteSage{% endblock %}

{% block content %}
<h2>Log in</h2>
<form method="post" class="stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Log in</button>
</form>
<p class="mt-3 text-muted">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
