{% extends "base.html" %}

{% block title %}Sign up — NoteSage{% endblock %}

{% block content %}
<h2>Create your account</h2>
<form method="post" class="stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Sign up</button>
</form>
<p class="mt-3 text-muted">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
